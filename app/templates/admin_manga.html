{% extends "admin_base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-white mb-4">Manga Management</h2>

    <!-- Advanced Search Form -->
    <div class="card bg-dark text-white mb-4">
        <div class="card-body">
            <form id="manga-search-form">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="title-input">Title</label>
                        <input type="text" class="form-control bg-dark text-white" id="title-input" placeholder="Enter manga title">
                    </div>
                    <div class="col-md-3">
                        <label for="year-input">Year</label>
                        <input type="number" class="form-control bg-dark text-white" id="year-input" placeholder="e.g., 2023">
                    </div>
                    <div class="col-md-3">
                        <label for="order-select">Order By</label>
                        <select class="form-select bg-dark text-white" id="order-select">
                            <option value="">Default (Latest Uploaded)</option>
                            <option value="rating.desc">Rating Desc</option>
                            <option value="followedCount.desc">Follows Desc</option>
                            <option value="year.desc">Year Desc</option>
                            <option value="title.asc">Title Asc</option>
                        </select>
                    </div>
                </div>

                <!-- Include & Exclude Tags (Checkbox) -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label>Include Tags</label>
                        <div class="tag-checkbox-container border rounded p-3" style="max-height: 200px; overflow-y: auto;">
                            <input type="text" class="form-control form-control-sm mb-2" placeholder="Search tags..." id="include-search">
                            <div id="include-tags-list"></div>
                            <div class="text-end mt-2">
                                <small><a href="#" class="text-warning" id="clear-include">Clear all</a></small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label>Exclude Tags</label>
                        <div class="tag-checkbox-container border rounded p-3" style="max-height: 200px; overflow-y: auto;">
                            <input type="text" class="form-control form-control-sm mb-2" placeholder="Search tags..." id="exclude-search">
                            <div id="exclude-tags-list"></div>
                            <div class="text-end mt-2">
                                <small><a href="#" class="text-warning" id="clear-exclude">Clear all</a></small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Other Filters -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label>Demographics</label>
                        <select class="form-select bg-dark text-white" id="demographics" multiple></select>
                    </div>
                    <div class="col-md-4">
                        <label>Content Ratings</label>
                        <select class="form-select bg-dark text-white" id="content-ratings" multiple></select>
                    </div>
                    <div class="col-md-4">
                        <label>Statuses</label>
                        <select class="form-select bg-dark text-white" id="statuses" multiple></select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary w-100 w-md-auto" id="search-btn">Search</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Search Results -->
    <div id="search-results" class="card bg-dark text-white">
        <div class="card-body">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Manga ID</th>
                        <th>Title</th>
                        <th>Chapters (DB/API)</th>
                        <th>Covers (DB/API)</th>
                        <th>Last Updated</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="manga-table-body">
                    <!-- Results loaded here -->
                </tbody>
            </table>

            <!-- Pagination -->
            <nav aria-label="Pagination">
                <ul class="pagination justify-content-center" id="pagination-controls"></ul>
            </nav>
        </div>
    </div>

    <!-- Action Confirmation Modal -->
    <div class="modal fade" id="action-modal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="modalLabel"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modal-body">
                    <div id="loading-spinner" class="d-none text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p>Processing, please wait...</p>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirm-action">Confirm</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- CSS for Tags -->
<style>
    .tag-checkbox-container label {
        display: block;
        margin: 4px 0;
        font-size: 0.9rem;
    }
    .tag-checkbox-container .form-check {
        margin: 2px 0;
    }
    .tag-checkbox-container .tag-group {
        font-weight: bold;
        color: #ffc107;
        margin-top: 12px;
        margin-bottom: 6px;
        font-size: 0.95rem;
    }
    .tag-checkbox-container .tag-item {
        margin-left: 16px;
        font-weight: normal;
        color: #ddd;
    }
    .tag-checkbox-container .form-check-input:checked {
        background-color: #0d6efd;
        border-color: #0d6efd;
    }
</style>

<script src="{{ url_for('static', filename='js/admin_manga.js') }}"></script>
{% endblock %}
